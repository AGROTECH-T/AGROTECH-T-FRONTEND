# Sitio estático del frontend.
# Propósito: entregar la aplicación y devolver index.html en rutas del cliente.
# Contexto: Nginx escucha dentro del contenedor, en el puerto 80.
# @author Cristian Deysdayr Jimenez

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://agrotech-t-backend-backend-1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 3m;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
